<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14110d">
  <title>Forked Kingdoms World Builder</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/features.css?v=2.1.0">
  <link rel="stylesheet" href="/admin-v4.css?v=2.1.0">
  <link rel="stylesheet" href="/admin-v21.css?v=2.1.0">
</head>
<body>
<header class="topbar admin-topbar">
  <div><div class="game-title">FORKED KINGDOMS 2.1.0</div><div class="subtitle">World Builder · InN8 Labs</div></div>
  <div class="top-actions"><a href="/" class="ghost-btn admin-link">Game</a><button id="publishAllTop" class="primary" hidden>Publish World Update</button><button id="logoutBtn" class="ghost-btn" hidden>Sign Out</button></div>
</header>
<main class="admin-shell">
  <section id="loginPanel" class="panel admin-login">
    <div class="eyebrow">INN8 LABS</div><h1>World Builder</h1><p class="muted">Build the world, inspect its paths, preview Decision Cards, and manage artwork for scenes, characters, familiars, and equipment.</p>
    <label>Email<input id="adminEmail" name="admin-email-manual" type="email" value="" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Admin email"></label>
    <label>Password<input id="adminPassword" name="admin-password-manual" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" class="primary">Sign In</button><p id="loginError" class="error-text"></p>
  </section>

  <section id="adminPanel" hidden>
    <nav class="admin-nav" aria-label="World Builder sections">
      <button data-view="overview" class="active">Overview</button>
      <button data-view="players">Player Characters</button>
      <button data-view="story">Story</button>
      <span class="nav-divider"></span>
      <button data-view="location">Locations</button>
      <button data-view="npc">NPCs</button>
      <button data-view="familiar">Familiars</button>
      <button data-view="special_item">Special Items</button>
      <button data-view="special_weapon">Special Weapons</button>
      <button data-view="boon">Boons</button>
      <span class="nav-divider"></span>
      <button data-view="gui">GUI</button>
      <a class="admin-nav-link" href="/api/admin/marketing/subscribers.csv">Email List CSV</a>
    </nav>
    <div id="adminContent" class="admin-content"><div class="loading-card">Opening the world ledger…</div></div>
  </section>
</main>
<script src="/data/world-data.js?v=2.1.0"></script>
<script src="/data/decision-cards-v2.js?v=2.1.0"></script>
<script src="/data/quest-visuals-v21.js?v=2.1.0"></script>
<script src="/admin-v4-loader.js?v=2.1.0"></script>
<script src="/admin-v21.js?v=2.1.0"></script>
</body>
</html>
